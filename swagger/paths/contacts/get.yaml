tags:
  - Contacts
summary: Get contact list
operationId: getContactsList
description: Get paginated and sorted list of user's contacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number
    required: false
    schema:
      type: integer
      default: 1
  - name: perPage
    in: query
    description: Number of items per page
    required: false
    schema:
      type: integer
      default: 10
  - name: sortBy
    in: query
    description: Field to sort by
    required: false
    schema:
      type: string
  - name: sortOrder
    in: query
    description: Sort order (asc or desc)
    required: false
    schema:
      type: string
      enum: [asc, desc]
responses:
  "200":
    description: Successfully retrieved contact list
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: "../../components/schemas/contact.yaml"
                page:
                  type: integer
                perPage:
                  type: integer
                totalItems:
                  type: integer
                totalPages:
                  type: integer
                hasPreviousPage:
                  type: boolean
                hasNextPage:
                  type: boolean
  "401":
    $ref: ../../components/responses/401.yaml
  "400":
    $ref: ../../components/responses/400.yaml
  "404":
    $ref: ../../components/responses/400.yaml
